<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiger Conservation — Overview Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --high:     #225522;
      --moderate: #78AA50;
      --stable:   #B4C378;
      --capacity: #C8AF64;
      --ink:      #1a1a18;
      --cream:    #f7f4ee;
      --slate:    #5a6070;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      color: var(--ink);
      background: var(--cream);
    }
    header {
      padding: 24px 28px 16px;
      max-width: 1100px;
      margin: 0 auto;
    }
    header h1 { color: var(--high); font-size: 1.5rem; }
    header p  { color: var(--slate); font-size: 0.95rem; margin-top: 4px; }

    #map {
      height: 620px;
      max-width: 1100px;
      margin: 8px auto 32px;
      border: 1px solid #d4cfc4;
      border-radius: 4px;
    }

    .legend {
      background: white;
      padding: 12px 14px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      font-size: 0.82rem;
      line-height: 1.7;
    }
    .legend h4 { margin-bottom: 6px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate); }
    .legend .row { display: flex; align-items: center; gap: 8px; }
    .legend .swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }

    /* Permanent reserve labels — light, no border, sits beside the marker */
    .reserve-label {
      background: rgba(255,255,255,0.82);
      border: none !important;
      box-shadow: none !important;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--ink);
      padding: 1px 5px;
      white-space: nowrap;
    }
    .reserve-label::before { display: none !important; }  /* hide tooltip arrow */

    .reserve-popup h3 { color: var(--high); font-size: 1rem; margin-bottom: 6px; }
    .reserve-popup table { font-size: 0.82rem; border-collapse: collapse; }
    .reserve-popup td { padding: 2px 8px 2px 0; vertical-align: top; }
    .reserve-popup td:first-child { color: var(--slate); }
    .reserve-popup .big { font-weight: 600; color: var(--ink); }
  </style>
</head>
<body>

  <header>
    <h1>India's Tiger Conservation Success Stories</h1>
    <p>Seven reserves, shaded by population growth category (2006–2022). Click any reserve for detail.</p>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ============================================================
    // 1. CREATE THE MAP — India-centric, with a soft boundary so
    //    users can't wander off to Vietnam, and a min zoom.
    // ============================================================
    const map = L.map('map', {
      maxBounds: [[2, 64], [37, 96]],   // soft wall around the region
      maxBoundsViscosity: 0.7,           // resist dragging past it
      minZoom: 4
    }).setView([22, 80], 5);

    // ============================================================
    // 2. BASEMAP — Esri Light Gray Canvas (neutral).
    // ============================================================
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 16
    }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16
    }).addTo(map);

    // ============================================================
    // 3. COLOR FUNCTION
    // ============================================================
    function colorFor(category) {
      switch (category) {
        case 'High growth':           return '#225522';
        case 'Moderate growth':       return '#78AA50';
        case 'Stable':                return '#B4C378';
        case 'Stable / At capacity':  return '#C8AF64';
        default:                      return '#cccccc';
      }
    }

    // ============================================================
    // 4. POLYGON STYLE
    // ============================================================
    function styleReserve(feature) {
      return {
        fillColor: colorFor(feature.properties.Growth_Category),
        fillOpacity: 0.9,
        color: '#1E1E1E',
        weight: 2,
        opacity: 1
      };
    }

    // ============================================================
    // 5. POPUP BUILDER
    // ============================================================
    function popupFor(p) {
      const pct = Math.round(p.Pct_Change);
      const density = p.Density_2022 ? p.Density_2022.toFixed(1) : '—';
      return `
        <div class="reserve-popup">
          <h3>${p.Reserve_Name}</h3>
          <table>
            <tr><td>State</td><td class="big">${p.State || '—'}</td></tr>
            <tr><td>Landscape</td><td>${p.Landscape || '—'}</td></tr>
            <tr><td>Tigers 2006</td><td class="big">${p.Pop_2006 ?? '—'}</td></tr>
            <tr><td>Tigers 2022</td><td class="big">${p.Pop_2022 ?? '—'}</td></tr>
            <tr><td>Change</td><td class="big">${isNaN(pct) ? '—' : '+' + pct + '%'}</td></tr>
            <tr><td>Density</td><td>${density} / 100 km²</td></tr>
            <tr><td>Category</td><td>${p.Growth_Category}</td></tr>
          </table>
        </div>`;
    }

    // Label placement overrides for the two close pairs, so permanent
    // labels don't stack. Keyed by Reserve_Name.
    const labelDirection = {
      'Nagarahole National Park':       { direction: 'left',  offset: [-8, -4] },
      'Bandipur National Park':         { direction: 'right', offset: [8, 8] },
      'Kanha National Park':            { direction: 'right', offset: [8, -4] },
      'Pench Tiger Reserve (Combined)': { direction: 'left',  offset: [-8, 8] }
    };

    // ============================================================
    // 6. LOAD GEOJSON → polygons + circle markers + labels.
    // ============================================================
    fetch('data/tiger_reserves.geojson')
      .then(response => response.json())
      .then(data => {

        // --- 6a. Polygons ---
        L.geoJSON(data, {
          style: styleReserve,
          onEachFeature: (feature, lyr) => {
            lyr.bindPopup(popupFor(feature.properties));
            lyr.on('mouseover', () => lyr.setStyle({ weight: 3.5 }));
            lyr.on('mouseout',  () => lyr.setStyle({ weight: 2 }));
          }
        }).addTo(map);

        // --- 6b. Markers + permanent labels ---
        data.features.forEach(feature => {
          const p = feature.properties;
          const lat = p.FIRST_SitLat, lng = p.FIRST_SitLong;
          if (lat == null || lng == null) return;

          const marker = L.circleMarker([lat, lng], {
            radius: 7,
            fillColor: colorFor(p.Growth_Category),
            fillOpacity: 1,
            color: '#ffffff',
            weight: 2
          }).addTo(map);

          marker.bindPopup(popupFor(p));

          // Permanent label, with per-reserve placement for the close pairs
          const placement = labelDirection[p.Reserve_Name]
                          || { direction: 'right', offset: [8, 0] };
          marker.bindTooltip(p.Reserve_Name, {
            permanent: true,
            direction: placement.direction,
            offset: placement.offset,
            className: 'reserve-label'
          });
        });

        // --- 6c. Frame India tightly (matches ArcGIS overview extent) ---
        map.fitBounds([[6.5, 68], [32, 90]], { padding: [20, 20] });
      })
      .catch(err => {
        console.error('Failed to load reserves:', err);
        alert('Could not load tiger_reserves.geojson — check the data/ path.');
      });

    // ============================================================
    // 7. LEGEND
    // ============================================================
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <h4>Growth Category</h4>
        <div class="row"><span class="swatch" style="background:#225522"></span> High growth</div>
        <div class="row"><span class="swatch" style="background:#78AA50"></span> Moderate growth</div>
        <div class="row"><span class="swatch" style="background:#B4C378"></span> Stable</div>
        <div class="row"><span class="swatch" style="background:#C8AF64"></span> Stable / At capacity</div>
      `;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
