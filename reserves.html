<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiger Conservation — Reserve Profiles</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --high: #225522; --moderate: #78AA50; --stable: #B4C378; --capacity: #C8AF64;
      --ink: #1a1a18; --cream: #f7f4ee; --slate: #5a6070; --forest: #225522; --mist: #edeae3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Source Sans 3', system-ui, sans-serif; color: var(--ink); background: var(--cream); }
    header { padding: 24px 28px 12px; }
    header h1 { color: var(--forest); font-size: 1.5rem; }
    header p  { color: var(--slate); font-size: 0.95rem; margin-top: 4px; max-width: 760px; }

    .controls { padding: 0 28px 12px; display: flex; align-items: center; gap: 12px; }
    .controls label { font-weight: 600; font-size: 0.9rem; color: var(--slate); }
    .controls select {
      font-family: inherit; font-size: 0.95rem; padding: 7px 12px;
      border: 1px solid #d4cfc4; border-radius: 4px; background: white; color: var(--ink); cursor: pointer;
    }

    .layout { display: flex; height: 80vh; margin: 0 0 32px; }
    #map { flex: 1; border: 1px solid #d4cfc4; }

    /* Embedded mode: hide header text, fill the frame */
    body.embedded header { display: none; }
    body.embedded .controls { padding: 10px 16px; }
    body.embedded .layout { height: calc(100vh - 48px); margin: 0; }
    .panel {
      width: 320px; flex-shrink: 0; background: white; border: 1px solid #d4cfc4; border-left: none;
      padding: 22px; overflow-y: auto;
    }
    .panel h2 { color: var(--forest); font-size: 1.2rem; margin-bottom: 2px; }
    .panel .sub { color: var(--slate); font-size: 0.82rem; margin-bottom: 16px; }
    .panel .cat {
      display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 3px 9px;
      border-radius: 3px; margin-bottom: 16px; color: white;
    }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat { background: var(--mist); border-radius: 4px; padding: 10px 12px; }
    .stat .label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate); }
    .stat .value { font-size: 1.15rem; font-weight: 600; color: var(--ink); margin-top: 2px; }
    .stat .value small { font-size: 0.7rem; font-weight: 400; color: var(--slate); }
    .stat.full { grid-column: 1 / -1; }
    .pop-change { font-size: 1.4rem; font-weight: 700; }

    .legend-inline { margin-top: 18px; font-size: 0.75rem; color: var(--slate); line-height: 1.7; }
    .legend-inline .row { display: flex; align-items: center; gap: 8px; }
    .legend-inline .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

    /* Mobile: stack map on top, stats panel below (instead of side-by-side).
       The horizontal 320px panel eats the screen on narrow viewports. */
    @media (max-width: 760px) {
      .layout { flex-direction: column; height: auto; }
      #map { height: 60vh; min-height: 340px; width: 100%; flex: none; }
      .panel {
        width: 100%; border-left: 1px solid #d4cfc4; border-top: none;
        max-height: none; overflow-y: visible;
      }
      body.embedded .layout { height: auto; }
      body.embedded #map { height: 58vh; min-height: 320px; }
      /* two-column stat grid stays readable on phones */
      .stat-grid { grid-template-columns: 1fr 1fr; }
    }

    /* Reserve label — cyan to match the boundary, dark backing for legibility on imagery */
    .reserve-label {
      background: rgba(0,26,26,0.75); border: none !important; box-shadow: none !important;
      font-size: 0.92rem; font-weight: 700; color: #00f5ff; padding: 3px 8px; border-radius: 3px;
    }
    .reserve-label::before { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>Reserve Profiles</h1>
    <p>Select a reserve to view its population recovery, habitat characteristics, and the tiger detection
       records and hot spot clusters in its vicinity. Switch basemaps (top-right) to see terrain and vegetation.</p>
  </header>

  <div class="controls">
    <label for="reserve-select">Reserve:</label>
    <select id="reserve-select"></select>
  </div>

  <div class="layout">
    <div id="map"></div>
    <div class="panel" id="panel"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    if (window.self !== window.top) document.body.classList.add('embedded');
  </script>

  <script>
    // ============================================================
    // 1. MAP + BASEMAPS (satellite default, topo + gray as options)
    // ============================================================
    const map = L.map('map', { zoomSnap: 0.25, minZoom: 4 }).setView([22, 80], 5);

    // Satellite imagery (terrain + vegetation color, real)
    const imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Imagery &copy; Esri', maxZoom: 17
    });
    // Light labels to overlay on imagery (place names, roads)
    const imageryLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 17, opacity: 0.9
    });
    const imageryGroup = L.layerGroup([imagery, imageryLabels]);

    // Topographic (terrain shading + vegetation tints + full labels)
    const topo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 17
    });

    // Light gray (the clean option from earlier maps)
    const gray = L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 })
    ]);

    imageryGroup.addTo(map);  // default
    L.control.layers({
      'Satellite (imagery)': imageryGroup,
      'Topographic (terrain)': topo,
      'Light gray': gray
    }, null, { position: 'topright', collapsed: false }).addTo(map);

    function colorFor(c) {
      return { 'High growth':'#225522','Moderate growth':'#78AA50','Stable':'#B4C378','Stable / At capacity':'#C8AF64' }[c] || '#cccccc';
    }
    const giStyle = {
      '3':{color:'#B30000',r:7},'2':{color:'#E34A33',r:6},'1':{color:'#FC8D59',r:5},
      '0':{color:'#CCCCCC',r:3},'-1':{color:'#9E9AC8',r:5},'-2':{color:'#756BB1',r:6},'-3':{color:'#3F007D',r:8}
    };

    function distKm(a, b) {
      const R = 6371, toRad = x => x*Math.PI/180;
      const dLat = toRad(b[0]-a[0]), dLng = toRad(b[1]-a[1]);
      const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLng/2)**2;
      return 2*R*Math.asin(Math.sqrt(s));
    }

    let reservesData, gbifData, hotspotData;
    let reserveLayer, gbifLayer, hotspotLayer;
    const FILTER_KM = 80;

    // ============================================================
    // 2. LOAD DATA, build selector
    // ============================================================
    Promise.all([
      fetch('data/tiger_reserves.geojson').then(r=>r.json()),
      fetch('data/gbif_points.geojson').then(r=>r.json()),
      fetch('data/hotspot.geojson').then(r=>r.json())
    ]).then(([res, gbif, hot]) => {
      reservesData = res; gbifData = gbif; hotspotData = hot;
      const sel = document.getElementById('reserve-select');
      [...res.features].sort((a,b)=>(b.properties.Pct_Change||0)-(a.properties.Pct_Change||0))
        .forEach(f => {
          const o = document.createElement('option');
          o.value = f.properties.Reserve_ID; o.textContent = f.properties.Reserve_Name;
          sel.appendChild(o);
        });
      sel.addEventListener('change', () => showReserve(+sel.value));

      // Pre-select from ?reserve=<Reserve_ID> if present and valid
      const params = new URLSearchParams(window.location.search);
      const requested = params.get('reserve');
      if (requested && [...sel.options].some(o => o.value === requested)) {
        sel.value = requested;
      }
      showReserve(+sel.value);
    });

    // Keep the map correctly sized when the viewport changes (e.g. phone
    // rotation, or the layout switching between side-by-side and stacked).
    // Leaflet needs invalidateSize when its container is resized.
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => map.invalidateSize(), 150);
    });

    // ============================================================
    // 3. showReserve — outline-only polygon, tighter zoom
    // ============================================================
    function showReserve(reserveId) {
      const feature = reservesData.features.find(f => f.properties.Reserve_ID === reserveId);
      const p = feature.properties;
      const center = [p.FIRST_SitLat, p.FIRST_SitLong];

      [reserveLayer, gbifLayer, hotspotLayer].forEach(l => { if (l) map.removeLayer(l); });

      // Outline-only reserve (no fill). Dark halo underneath + bright
      // cyan on top — pops on satellite imagery, doesn't clash with red hotspots.
      reserveLayer = L.geoJSON(feature, {
        style: { fill: false, color: '#001a1a', weight: 6, opacity: 0.7 }
      }).addTo(map);
      const inner = L.geoJSON(feature, {
        style: { fill: false, color: '#00f5ff', weight: 2.5, opacity: 1 }
      }).addTo(map);
      reserveLayer._innerOutline = inner;  // track so we remove it too

      // Cyan name label, centered on the reserve
      inner.bindTooltip(p.Reserve_Name, {
        permanent: true, direction: 'top', className: 'reserve-label', offset: [0, -4]
      }).openTooltip();

      // nearby hotspots
      const hotNear = { type:'FeatureCollection', features: hotspotData.features.filter(f=>{
        const [lng,lat]=f.geometry.coordinates; return distKm(center,[lat,lng])<=FILTER_KM;
      })};
      hotspotLayer = L.geoJSON(hotNear, {
        pointToLayer: (f,ll)=>{
          const s = giStyle[String(f.properties.Gi_Bin)]||giStyle['0'];
          return L.circleMarker(ll,{radius:s.r,fillColor:s.color,fillOpacity:f.properties.Gi_Bin===0?0.4:0.9,color:'#fff',weight:0.8});
        }
      }).addTo(map);

      // nearby GBIF (faint)
      const gbifNear = { type:'FeatureCollection', features: gbifData.features.filter(f=>{
        const [lng,lat]=f.geometry.coordinates; return distKm(center,[lat,lng])<=FILTER_KM;
      })};
      gbifLayer = L.geoJSON(gbifNear, {
        pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:3,fillColor:'#ffffff',fillOpacity:0.6,color:'#333',weight:0.5})
      }).addTo(map);
      gbifLayer.bringToBack();

      // tighter zoom: less padding, allow closer maxZoom
      const bounds = reserveLayer.getBounds();
      map.flyToBounds(bounds.pad(0.25), { duration: 0.6, maxZoom: 12 });

      fillPanel(p, gbifNear.features.length, hotNear.features.length);
    }

    // remove helper: also clear the inner outline
    const _origRemove = map.removeLayer.bind(map);
    map.removeLayer = function(l) {
      if (l && l._innerOutline) _origRemove(l._innerOutline);
      return _origRemove(l);
    };

    // ============================================================
    // 4. fillPanel
    // ============================================================
    function fillPanel(p, gbifCount, hotCount) {
      const pct = Math.round(p.Pct_Change);
      const pctStr = isNaN(pct) ? '—' : (pct>=0?'+':'') + pct + '%';
      const dens = p.Density_2022 ? p.Density_2022.toFixed(1) : '—';
      const area = p.Area_sqkm ? Math.round(p.Area_sqkm).toLocaleString() : '—';
      const forest = p.Forest_Pct ? p.Forest_Pct.toFixed(1) + '%' : '—';
      const elev = (p.Elev_Min!=null && p.Elev_Max!=null) ? `${p.Elev_Min}–${p.Elev_Max} m` : '—';

      document.getElementById('panel').innerHTML = `
        <h2>${p.Reserve_Name}</h2>
        <div class="sub">${p.State || ''} · ${p.Landscape || ''}</div>
        <span class="cat" style="background:${colorFor(p.Growth_Category)}">${p.Growth_Category}</span>
        <div class="stat-grid">
          <div class="stat full">
            <div class="label">Population change 2006 → 2022</div>
            <div class="pop-change" style="color:${pct>=0?'#225522':'#B30000'}">${pctStr}</div>
            <div class="value"><small>${p.Pop_2006 ?? '—'} → ${p.Pop_2022 ?? '—'} tigers</small></div>
          </div>
          <div class="stat"><div class="label">Density 2022</div><div class="value">${dens}<small> /100 km²</small></div></div>
          <div class="stat"><div class="label">Reserve area</div><div class="value">${area}<small> km²</small></div></div>
          <div class="stat"><div class="label">Forest cover</div><div class="value">${forest}</div></div>
          <div class="stat"><div class="label">Elevation</div><div class="value" style="font-size:0.95rem">${elev}</div></div>
          <div class="stat"><div class="label">GBIF records nearby</div><div class="value">${gbifCount}</div></div>
          <div class="stat"><div class="label">Hot spot points</div><div class="value">${hotCount}</div></div>
        </div>
        <div class="legend-inline">
          <div style="font-weight:600;text-transform:uppercase;font-size:0.68rem;letter-spacing:0.05em;margin-bottom:6px;">On the map</div>
          <div class="row"><span class="dot" style="background:#00f5ff;border:1px solid #001a1a"></span> Reserve boundary</div>
          <div class="row"><span class="dot" style="background:#B30000"></span> Hot spot (red = significant cluster)</div>
          <div class="row"><span class="dot" style="background:#3F007D"></span> Cold spot (purple)</div>
          <div class="row"><span class="dot" style="background:#fff;border:1px solid #333"></span> GBIF detection record</div>
          <div style="margin-top:8px;font-style:italic;">Points within ${FILTER_KM} km of the reserve centre.</div>
        </div>
      `;
    }
  </script>
</body>
</html>
